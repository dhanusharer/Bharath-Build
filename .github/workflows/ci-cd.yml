name: Bharat Builds & Superpower CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. BACKEND CI: Python 3.12, Lint, Typecheck, Safety Gate & Tests
  # =========================================================================
  backend-ci:
    name: Backend CI (Python 3.12 / FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Code Quality & Linting (Ruff)
        run: ruff check app

      - name: Code Formatting Verification (Ruff Format)
        run: ruff format --check app

      - name: Static Type Checking (Mypy)
        run: mypy app

      - name: Deterministic Safety Gate & Posology Unit Tests
        env:
          APP_ENV: test
          AWS_DEFAULT_REGION: ap-south-1
        run: pytest tests/unit -v --cov=app --cov-report=term-missing

  # =========================================================================
  # 2. FRONTEND CI: Node 20, Lint, Safety UX Tests & Next.js Build
  # =========================================================================
  frontend-ci:
    name: Frontend CI (Next.js 14 / React 18)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Frontend Safety UX & Medication Display Unit Tests
        run: npm test

      - name: Next.js Production Build Compilation
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: npm run build

  # =========================================================================
  # 3. DOCKER CONTAINER VERIFICATION
  # =========================================================================
  docker-build:
    name: Docker Container Build Check
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: bharat-builds-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # 4. AWS DEPLOYMENT GATEWAY (Staging / Production Pipeline)
  # =========================================================================
  deployment-status:
    name: AWS Deployment Verification
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify AWS Deployment Manifests
        run: |
          echo "=== AWS Deployment Readiness Check ==="
          test -f amplify.yml && echo "✓ Root AWS Amplify specification verified"
          test -f frontend/amplify.yml && echo "✓ Frontend AWS Amplify specification verified"
          test -f backend/Dockerfile && echo "✓ Backend Dockerfile verified"
          echo "=== All CI/CD Safety & Quality Gates Passed ==="
